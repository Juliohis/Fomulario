<html>
    <head>
        <meta charset="UTF-8">
        <title>Formulario de cadastro</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body  style="background-color:lightpink;">
        <div class="cabecalho">
            <img class="logo" src="C:\Users\Julio.DESKTOP-2EPHDSJ\.vscode-shared\Nova pasta\Fomulario\Fomulario_Main_final\147826225.png" alt="Logo">
            <h1 class="titulo">Formulario de cadastro</h1>
        </div>
        <form action="obrigado.html" method="get">
            <fieldset>
                <legend>Preencha o formulario</legend>
                <label class="caixa">Nome*:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required><br>
                <label class="caixa">Email*:</label>
                <input type="email" name="email" placeholder="Digite seu e-mail" required><br>
                <label class="caixa">Telefone*:</label>
                <input type="tel" name="telefone" placeholder="(xx)xxxxx-xxxx" required><br>
                <label class="caixa">idade*:</label>
                <input type="number" name="idade" min="0" max="200" placeholder="xx" required><br>
                <label>Avalie nosso site:</label>
                <input class="range" type="range" name="avaliacao" min="1" max="5" step=".1" required><br>
            </fieldset>
            <fieldset>
                <legend>Informações do curso</legend>   
                <label>Curso:</label>
                <select name="curso" required>
                    <option value="" disabled selected>Selecione um curso</option>
                    <option value="ADS">ADS</option>
                    <option value="Medicina">Medicina</option>
                    <option value="Administração">Administração</option>
                    <option value="Nada">Nada</option>
                </select><br>
           
                <span>Selecione o periodo:</span>
                <input type="checkbox" name="manhã">
                <label for="manhã">Manhã</label>
                <input type="checkbox" name="Tarde">
                <label for="Tarde">Tarde</label>
                <input type="checkbox" name="Noite">
                <label for="Noite">Noite</label><br>
            
                <label>Digite uma mensagem ou comentario:</label><br>
                <textarea name="mensagem" placeholder="Digite seu comentario" required></textarea><br>
            
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button><br>
            </fieldset>
        </form>
        <img src="pink-godzilla-yas-godzilla.gif" alt="godizilla.gif">
        <footer>
